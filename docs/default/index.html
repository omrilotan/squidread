<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Make Squidread your default reader</title>
	<meta name="description" content="Open your EPUB files straight in Squidread, on Android phones and on Boox." />
	<meta name="theme-color" content="#ffffff" />
	<link rel="icon" href="../favicon.png" type="image/png" sizes="32x32" />
	<link rel="icon" href="../favicon-128.png" type="image/png" sizes="128x128" />
	<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
	<link rel="stylesheet" href="../styles.css" />
</head>
<body>
	<main class="policy">
		<p><a href="../">← Squidread</a></p>
		<h1>Make Squidread your default reader</h1>
		<p>Set it once, and your books open straight in Squidread.</p>

		<ul class="default-steps">
			<li>
				<figure>
					<img src="boox.png" alt="The Boox Open with dialog, with Squidread circled and Set as default ticked" width="1072" height="1448" loading="lazy" />
					<figcaption>
						<strong>Boox</strong>
						<ol>
							<li>Long press a book and tap <strong>Open with</strong>.</li>
							<li>Tick <strong>Set as default</strong> and choose Squidread.</li>
						</ol>
					</figcaption>
				</figure>
			</li>
			<li>
				<figure>
					<img src="android.jpg" alt="Android's Open with dialog for an EPUB file, with Squidread selected above the Once and Always buttons" width="1080" height="2400" loading="lazy" />
					<figcaption>
						<strong>Android</strong>
						<ol>
							<li>Tap an EPUB file in your file manager, or long press it and tap <strong>Open with</strong>.</li>
							<li>Choose Squidread, then <strong>Always</strong>.</li>
						</ol>
					</figcaption>
				</figure>
			</li>
		</ul>
	</main>

	<footer>
		<a href="../">Home</a>
		<a href="../privacy/">Privacy policy</a>
		<a href="https://github.com/omrilotan/squidread">Source on GitHub</a>
	</footer>
</body>
</html>
